name: Docker

# Builds the production image (frontend + backend in one container), scans it, and
# smoke-tests it. Nothing is published: users build the image themselves from source.
# The weekly run catches CVEs disclosed in the base images since the last change.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege. No job needs more than read access.
permissions:
  contents: read

# A new push to a PR cancels the superseded run. Runs on main are never cancelled, so
# every commit on main gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docker-compose.yml lists backend/.env as an env_file, and that file is gitignored.
      - name: Create backend/.env from the example
        run: cp backend/.env.example backend/.env

      - name: Validate compose file
        run: docker compose config --quiet

  # Users build the image on their own machine, so it has to build and boot on both CPU
  # types people self-host on: x86_64 PCs and servers, and arm64 (Raspberry Pi, Apple
  # Silicon). Each runs on a native runner, so neither build is emulated.
  build:
    name: Build, scan & smoke test (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # One architecture failing shouldn't hide whether the other one works.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Loads the image into the local Docker daemon, so the next steps can scan and run
      # exactly what `docker compose up --build` produces. Each architecture keeps its own
      # cache scope, so the two builds don't overwrite each other's layers.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: itinerary-planner:ci
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,scope=build-${{ matrix.arch }},mode=max

      # Fails on HIGH/CRITICAL vulnerabilities that have a fix available. Secrets and
      # misconfigurations are covered by the repository scan in security-scan.yml.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: itinerary-planner:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # The container runs `alembic upgrade head` and then starts uvicorn, so /health
      # only answers if the migrations applied and the app booted. Requesting / checks
      # that the built React bundle was copied into the image.
      - name: Start container
        run: docker run -d --name smoke -p 8000:8000 itinerary-planner:ci

      - name: Smoke test
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors \
            http://localhost:8000/health
          echo
          curl --fail --silent --show-error http://localhost:8000/ | grep -q 'id="root"'

      - name: Show container logs
        if: ${{ failure() }}
        run: docker logs smoke
