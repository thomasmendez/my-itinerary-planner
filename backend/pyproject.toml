[project]
name = "app"
version = "1.0.0"
description = "Backend API for a self-hosted trip planner: flight, hotel, and event search with a trip calendar"
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
authors = [
    { name = "thomasmendez" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]  # I = isort (import sorting), B = bugbear

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]  # app imports must follow the DATABASE_URL override
"alembic/versions/*" = ["I001"]  # generated by `alembic revision`

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]
